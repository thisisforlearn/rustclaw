[package]
name = "rustclaw"
version = "1.0.0"
edition = "2021"
description = "RustClaw - Ultra-optimized Pure Rust NNUE Chess Engine from scratch - by Vaibhav"
authors = ["Vaibhav"]
license = "GPL-3.0-only"
repository = "https://github.com/thisisforlearn/rustclaw"
homepage = "https://github.com/thisisforlearn/rustclaw"
keywords = ["chess", "nnue", "engine", "rust", "lichess"]
categories = ["games"]
readme = "README.md"
exclude = ["target/", "data/*.zst", "data/*.jsonl"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Max performance profile for training/inference
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "rustclaw"
path = "src/main.rs"

[[bin]]
name = "crabchess"
path = "src/main.rs"

[[bin]]
name = "trainer"
path = "src/bin/trainer.rs"

[[bin]]
name = "datagen"
path = "src/bin/datagen.rs"

[dependencies]
# Core chess - we vendor logic but use cozy-chess for movegen correctness + speed
cozy-chess = "0.3"
# NNUE / Tensor
rand = "0.8"
rand_distr = "0.4"
# Parallelism — key for 3100 in 10h on 12 threads
rayon = "1.8"
# Web UI
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Training progress
indicatif = "0.17"
clap = { version = "4", features = ["derive"] }
# Utils — max speed alloc + simd
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
memmap2 = "0.9"
byteorder = "1.5"
chrono = "0.4"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
criterion = "0.5"

[features]
simd = []
